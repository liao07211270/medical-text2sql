    - data:
        code: "import re\n\ndef main(sql_input: str) -> dict:\n    \n    # 若 LLM 回傳空值或非字串，直接攔截\n\
          \    if not sql_input or not isinstance(sql_input, str):\n        return\
          \ {\n            \"status\": \"danger\",\n            \"safe_sql\": \"\"\
          ,\n            \"message\": \"⚠️ 無法產生對應的查詢語句，請換個方式描述您的問題。\"\n        }\n\
          \    \n    sql_stripped = sql_input.strip()\n    sql_upper = sql_stripped.upper()\n\
          \    \n    # 若回傳內容不像 SQL（不含 SELECT、FROM），視為無關問題\n    if 'SELECT' not in\
          \ sql_upper or 'FROM' not in sql_upper:\n        return {\n            \"\
          status\": \"danger\",\n            \"safe_sql\": \"\",\n            \"message\"\
          : \"⚠️ 您的問題似乎與醫療資料庫無關，請輸入與病患、看診紀錄或處方相關的查詢。\"\n        }\n    \n    # 定義黑名單，使用正規表達式確保是獨立關鍵字（避免誤擋欄位名或資料表名）\n\
          \    forbidden_words = ['DROP', 'DELETE', 'UPDATE', 'INSERT', 'ALTER', 'TRUNCATE',\
          \ 'EXEC', 'EXECUTE', 'GRANT', 'REVOKE']\n    \n    for word in forbidden_words:\n\
          \        pattern = r'\\b' + word + r'\\b'\n        if re.search(pattern,\
          \ sql_upper):\n            return {\n                \"status\": \"danger\"\
          ,\n                \"safe_sql\": \"\",\n                \"message\": f\"\
          ⚠️ 資安系統攔截：偵測到禁用指令 '{word}'，本系統僅允許查詢操作。\"\n            }\n    \n    # 嚴格白名單：必須以\
          \ SELECT 開頭\n    if not sql_upper.startswith('SELECT'):\n        return\
          \ {\n            \"status\": \"danger\",\n            \"safe_sql\": \"\"\
          ,\n            \"message\": \"⚠️ 資安系統攔截：本系統僅允許執行 SELECT 查詢指令。\"\n      \
          \  }\n    \n    # 檢測通過\n    return {\n        \"status\": \"safe\",\n  \
          \      \"safe_sql\": sql_stripped,\n        \"message\": \"✅ 資安檢測通過，允許執行查詢。\"\
          \n    }"
