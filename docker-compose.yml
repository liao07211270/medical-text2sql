# 單獨啟動（不接 Dify）：docker compose up -d --build
# 接上自架 Dify：docker compose -f docker-compose.yml -f docker-compose.dify.yml up -d --build
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?請在 .env 設定 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: meddb
      MYSQL_READONLY_USER: ${MYSQL_READONLY_USER:-readonly}
      MYSQL_READONLY_PASSWORD: ${MYSQL_READONLY_PASSWORD:?請在 .env 設定 MYSQL_READONLY_PASSWORD}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    # 只開放本機連線，方便用 MySQL Workbench 檢查；不需要可整段移除
    # 預設 3307，避免與本機已安裝的 MySQL（3306）衝突
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  flask-api:
    build: ./api
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: meddb
      DB_USER: ${MYSQL_READONLY_USER:-readonly}
      DB_PASSWORD: ${MYSQL_READONLY_PASSWORD}
      MAX_ROWS: ${MAX_ROWS:-200}
      QUERY_TIMEOUT_MS: ${QUERY_TIMEOUT_MS:-5000}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  mysql_data:
